name: Sync weather & traffic data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          WEATHERUNION_KEY: ${{ secrets.WEATHERUNION_KEY }}
          GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY }}
        run: node scripts/sync.mjs

      - name: Commit data.json if changed
        run: |
          git config user.name "weather-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Sync data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No data changes, skipping commit."
          fi
