name: Sync weather & traffic data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          WEATHERUNION_KEY: ${{ secrets.WEATHERUNION_KEY }}
          GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
        run: node scripts/sync.mjs

      - name: Commit data.json and radar tiles if changed
        run: |
          git config user.name "weather-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          # These only exist once TOMORROW_API_KEY is configured -- add each individually
          # (rather than in one `git add`) so a missing file can't abort the whole command and
          # leave data.json unstaged too, which is exactly what happened in testing otherwise.
          # 2-tile mosaic (zoom 6, x45/y26 north half + x45/y27 south half) x 2 fields:
          [ -f tomorrow-precipitationIntensity-6-45-26.png ] && git add tomorrow-precipitationIntensity-6-45-26.png
          [ -f tomorrow-precipitationIntensity-6-45-27.png ] && git add tomorrow-precipitationIntensity-6-45-27.png
          [ -f tomorrow-cloudCover-6-45-26.png ] && git add tomorrow-cloudCover-6-45-26.png
          [ -f tomorrow-cloudCover-6-45-27.png ] && git add tomorrow-cloudCover-6-45-27.png
          # Retire the old single-tile files from the previous (pre-mosaic) layout, if present.
          [ -f tomorrow-precipitationIntensity.png ] && git rm --ignore-unmatch tomorrow-precipitationIntensity.png
          [ -f tomorrow-cloudCover.png ] && git rm --ignore-unmatch tomorrow-cloudCover.png
          if ! git diff --cached --quiet; then
            git commit -m "Sync data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No data changes, skipping commit."
          fi
